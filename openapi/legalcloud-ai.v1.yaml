      x-permiso: versiones.crear
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionIniciar"
      responses:
        "201":
          description: Versión reservada. Aún no es la vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaIniciada"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: Ya existe una carga sin confirmar para este documento
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /documentos/{documentoId}/versiones/{versionId}:
    parameters:
      - $ref: "#/components/parameters/DocumentoId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Versiones]
      operationId: obtenerVersion
      summary: Obtener una versión
      x-permiso: versiones.leer
      responses:
        "200":
          description: Versión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDocumento"
