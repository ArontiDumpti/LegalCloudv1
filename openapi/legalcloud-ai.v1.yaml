      description: |
        No envía el binario a la API. Reserva documento + versión 1 y devuelve
        una URL prefirmada de un solo uso. El procesamiento empieza al confirmar.
      x-permiso: documentos.crear
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentoIniciar"
            example:
              titulo: Reglamento de licencias
              tipo: reglamento
              origen: digital
              categoriaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nivelConfidencialidad: restringido
              nombreArchivo: reglamento-licencias.pdf
              tipoMime: application/pdf
              tamanoBytes: 482113
      responses:
        "201":
          description: Reserva creada y URL de carga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargaIniciada"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          description: El tamaño declarado supera el límite de la organización
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "415":
          description: Tipo MIME no admitido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

