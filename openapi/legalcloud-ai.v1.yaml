openapi: 3.0.3
info:
  title: LegalCloud AI API
  version: 1.0.0
  summary: Contrato API-first de la plataforma de gestión documental inteligente.
  description: |
    API HTTP de LegalCloud AI para organizaciones que administran expedientes
    y documentos administrativos, normativos o jurídicos.

    El contrato es la fuente de verdad. Base de datos, almacenamiento de objetos,
    OCR, índices vectoriales y el LLM se implementan detrás de estos recursos.

    ## Actores
    - `ADMIN`: usuarios, roles, auditoría global y configuración.
    - `RESPONSABLE_DOCUMENTAL`: expedientes, clasificación, versiones y ciclo de vida.
    - `ESPECIALISTA`: análisis, metadatos, OCR, resúmenes y consultas sobre expedientes asignados.
    - `CONSULTOR`: lectura, descarga, búsqueda y preguntas dentro de su alcance.

    ## Autorización
    Dos capas, ambas obligatorias:
    1. RBAC de organización (`permisos` del token).
    2. ACL del expediente (`responsable`, `editor`, `revisor`, `lector`) para
       especialista y consultor. El administrador y el responsable documental
       operan a nivel de organización.

    Un intento denegado responde `403` y queda en auditoría.

    ## Trazabilidad legal
    No hay borrado físico en v1. Expedientes y documentos se archivan.
    Cada versión es inmutable; restaurar crea una versión nueva que apunta
    a la de origen. Búsquedas y respuestas del asistente guardan un paquete
    de evidencia (versión, hash, página y fragmento).

    ## Procesamiento de IA
    Carga por URL prefirmada → confirmar → trabajo asíncrono de OCR (si el
    origen es digitalizado o el archivo no trae texto) → fragmentación →
    embeddings → estado `indexado`. La búsqueda híbrida y el asistente RAG
    solo usan versiones indexadas vigentes, salvo que la consulta fije una versión.

    ## Convenciones
    - Base: `/api/v1`. Organización tomada del claim `org_id` del JWT.
    - Fechas en ISO-8601 UTC. Identificadores UUID.
    - Listados con cursor (`limit`, `cursor`).
    - Errores `application/problem+json` (RFC 9457).
    - Mutaciones sensibles aceptan `Idempotency-Key`.
    - Toda respuesta incluye `X-Request-Id`.
  contact:
    name: LegalCloud AI
  license:
    name: Proprietary

servers:
  - url: https://api.legalcloud.example/api/v1
    description: Producción
  - url: https://api.staging.legalcloud.example/api/v1
    description: Staging

tags:
  - name: Autenticacion
    description: Identidad de primera parte. El acceso a recursos usa el JWT emitido aquí.
  - name: Usuarios
    description: Altas, invitación, suspensión y asignación de roles de organización.
  - name: Roles
    description: RBAC. Los cuatro roles de sistema no se eliminan; sí puede ajustarse un rol personalizado.
  - name: Categorias
    description: Taxonomía jerárquica para clasificar expedientes y documentos.
  - name: Expedientes
    description: Unidad de gestión. Agrupa documentos, participantes, estado y trazabilidad.
  - name: Documentos
    description: Pieza documental lógica. El binario vive en sus versiones.
  - name: Versiones
    description: Historial inmutable del archivo, con hash y procedencia.
  - name: Procesamiento
    description: Trabajos asíncronos de OCR e indexación semántica.
  - name: Busqueda
    description: Recuperación léxica, semántica o híbrida, con evidencia persistida.
  - name: Asistente
    description: Conversaciones RAG, respuestas con fuentes y resúmenes.
  - name: Notificaciones
    description: Avisos in-app producidos por el sistema.
  - name: Auditoria
    description: Bitácora append-only de operaciones, consultas y denegaciones.
  - name: Dashboard
    description: Indicadores operativos filtrados según el alcance del rol.
  - name: Sistema
    description: Salud del servicio.

security:
  - bearerAuth: []

paths:
  /salud:
    get:
      tags: [Sistema]
      operationId: obtenerSalud
      summary: Estado de la API
      security: []
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salud"

  /auth/iniciar-sesion:
    post:
      tags: [Autenticacion]
      operationId: iniciarSesion
      summary: Obtener tokens con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InicioSesion"
      responses:
        "200":
          description: Tokens emitidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"

  /auth/renovar:
    post:
      tags: [Autenticacion]
      operationId: renovarSesion
      summary: Rotar el refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "200":
          description: Nuevo par de tokens. El refresh anterior queda invalidado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /auth/cerrar-sesion:
    post:
      tags: [Autenticacion]
      operationId: cerrarSesion
      summary: Revocar el refresh token actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Renovacion"
      responses:
        "204":
          description: Sesión revocada
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /auth/yo:
    get:
      tags: [Autenticacion]
      operationId: obtenerPerfil
      summary: Perfil, roles y permisos efectivos
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /auth/aceptar-invitacion:
    post:
      tags: [Autenticacion]
      operationId: aceptarInvitacion
      summary: Activar una cuenta invitada y definir contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AceptarInvitacion"
      responses:
        "200":
          description: Cuenta activa y tokens emitidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "410":
          description: Invitación expirada o ya usada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /auth/recuperar-contrasena:
    post:
      tags: [Autenticacion]
      operationId: recuperarContrasena
      summary: Solicitar restablecimiento sin revelar si el correo existe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo:
                  type: string
                  format: email
      responses:
        "202":
          description: Solicitud aceptada

  /auth/cambiar-contrasena:
    post:
      tags: [Autenticacion]
      operationId: cambiarContrasena
      summary: Cambiar la contraseña de la sesión actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioContrasena"
      responses:
        "204":
          description: Contraseña actualizada. Se revocan los demás refresh tokens.
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /permisos:
    get:
      tags: [Roles]
      operationId: listarPermisos
      summary: Catálogo de permisos asignables
      x-permiso: roles.leer
      responses:
        "200":
          description: Permisos del producto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permiso"
        "403":
          $ref: "#/components/responses/Prohibido"

  /roles:
    get:
      tags: [Roles]
      operationId: listarRoles
      summary: Listar roles de la organización
      x-permiso: roles.leer
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rol"
        "403":
          $ref: "#/components/responses/Prohibido"
    post:
      tags: [Roles]
      operationId: crearRol
      summary: Crear un rol personalizado
      x-permiso: roles.gestionar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolCrear"
      responses:
        "201":
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rol"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /roles/{rolId}:
    parameters:
      - $ref: "#/components/parameters/RolId"
    get:
      tags: [Roles]
      operationId: obtenerRol
      summary: Obtener un rol
      x-permiso: roles.leer
      responses:
        "200":
          description: Rol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rol"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [Roles]
      operationId: actualizarRol
      summary: Renombrar o describir un rol personalizado
      description: Los roles de sistema rechazan cambios de código con `409`.
      x-permiso: roles.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolActualizar"
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rol"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /roles/{rolId}/permisos:
    parameters:
      - $ref: "#/components/parameters/RolId"
    put:
      tags: [Roles]
      operationId: reemplazarPermisos
      summary: Reemplazar el conjunto de permisos del rol
      x-permiso: roles.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permisos]
              properties:
                permisos:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    example: expedientes.leer
      responses:
        "200":
          description: Permisos reemplazados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rol"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Listar usuarios de la organización
      x-permiso: usuarios.leer
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoUsuario"
        - name: rol
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Coincidencia por nombre o correo
          schema:
            type: string
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaUsuarios"
        "403":
          $ref: "#/components/responses/Prohibido"
    post:
      tags: [Usuarios]
      operationId: invitarUsuario
      summary: Invitar un usuario y asignarle roles
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInvitar"
      responses:
        "201":
          description: Usuario en estado invitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /usuarios/{usuarioId}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Obtener un usuario
      x-permiso: usuarios.leer
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Actualizar nombre del usuario
      x-permiso: usuarios.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioActualizar"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /usuarios/{usuarioId}/roles:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    put:
      tags: [Usuarios]
      operationId: reemplazarRolesUsuario
      summary: Reemplazar los roles de organización del usuario
      x-permiso: usuarios.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Roles actualizados. Genera evento `usuario.roles_reemplazados`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /usuarios/{usuarioId}/suspender:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    post:
      tags: [Usuarios]
      operationId: suspenderUsuario
      summary: Suspender el acceso sin eliminar historial
      x-permiso: usuarios.gestionar
      responses:
        "200":
          description: Usuario suspendido y sesiones revocadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /usuarios/{usuarioId}/reactivar:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    post:
      tags: [Usuarios]
      operationId: reactivarUsuario
      summary: Reactivar un usuario suspendido
      x-permiso: usuarios.gestionar
      responses:
        "200":
          description: Usuario activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "409":
          $ref: "#/components/responses/Conflicto"

  /categorias:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Listar el árbol de categorías
      x-permiso: categorias.leer
      parameters:
        - name: soloActivas
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Categorías en orden de ruta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
        "403":
          $ref: "#/components/responses/Prohibido"
    post:
      tags: [Categorias]
      operationId: crearCategoria
      summary: Crear una categoría
      x-permiso: categorias.gestionar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaCrear"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /categorias/{categoriaId}:
    parameters:
      - $ref: "#/components/parameters/CategoriaId"
    get:
      tags: [Categorias]
      operationId: obtenerCategoria
      summary: Obtener una categoría
      x-permiso: categorias.leer
      responses:
        "200":
          description: Categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [Categorias]
      operationId: actualizarCategoria
      summary: Actualizar nombre, descripción o padre
      x-permiso: categorias.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaActualizar"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "409":
          description: Ciclo en la jerarquía o código duplicado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /categorias/{categoriaId}/desactivar:
    parameters:
      - $ref: "#/components/parameters/CategoriaId"
    post:
      tags: [Categorias]
      operationId: desactivarCategoria
      summary: Desactivar una categoría sin reescribir documentos históricos
      x-permiso: categorias.gestionar
      responses:
        "200":
          description: Categoría inactiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categoria"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /expedientes:
    get:
      tags: [Expedientes]
      operationId: listarExpedientes
      summary: Listar expedientes visibles para el usuario
      description: |
        Responsable documental y administrador ven la organización.
        Especialista y consultor solo ven expedientes donde son participantes.
      x-permiso: expedientes.leer
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoExpediente"
        - name: categoriaId
          in: query
          schema:
            type: string
            format: uuid
        - name: responsableId
          in: query
          schema:
            type: string
            format: uuid
        - name: nivelConfidencialidad
          in: query
          schema:
            $ref: "#/components/schemas/NivelConfidencialidad"
        - name: q
          in: query
          schema:
            type: string
        - name: desde
          in: query
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Página de expedientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaExpedientes"
        "403":
          $ref: "#/components/responses/Prohibido"
    post:
      tags: [Expedientes]
      operationId: crearExpediente
      summary: Abrir un expediente en estado borrador
      x-permiso: expedientes.crear
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpedienteCrear"
            example:
              titulo: Licencias de funcionamiento 2026
              descripcion: Expediente de reglamentos y resoluciones del procedimiento de licencias.
              categoriaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nivelConfidencialidad: restringido
              etiquetas: [licencias, procedimiento]
      responses:
        "201":
          description: Expediente creado. El creador queda como responsable del ACL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expediente"
        "403":
          $ref: "#/components/responses/Prohibido"
        "422":
          $ref: "#/components/responses/EntidadImprocesable"

  /expedientes/{expedienteId}:
    parameters:
      - $ref: "#/components/parameters/ExpedienteId"
    get:
      tags: [Expedientes]
      operationId: obtenerExpediente
      summary: Obtener un expediente
      x-permiso: expedientes.leer
      responses:
        "200":
          description: Expediente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expediente"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [Expedientes]
      operationId: actualizarExpediente
      summary: Actualizar metadatos sin cambiar el estado
      description: El estado solo cambia por `/transiciones`.
      x-permiso: expedientes.actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpedienteActualizar"
      responses:
        "200":
          description: Expediente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expediente"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: Expediente archivado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"

  /expedientes/{expedienteId}/transiciones:
    parameters:
      - $ref: "#/components/parameters/ExpedienteId"
    post:
      tags: [Expedientes]
      operationId: transicionarExpediente
      summary: Ejecutar una transición de estado
      description: |
        Transiciones válidas:
        - borrador → en_tramite (`abrir`)
        - en_tramite → en_revision (`enviar_a_revision`)
        - en_revision → en_tramite (`devolver`)
        - en_revision → cerrado (`cerrar`)
        - cerrado → archivado (`archivar`)
        - cerrado → en_tramite (`reabrir`, solo administrador o responsable documental)
      x-permiso: expedientes.transicionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransicionExpediente"
            example:
              accion: enviar_a_revision
              comentario: Reglamento y resolución ya indexados.
      responses:
        "200":
          description: Estado actualizado y evento de auditoría registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expediente"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

  /expedientes/{expedienteId}/participantes:
    parameters:
      - $ref: "#/components/parameters/ExpedienteId"
    get:
      tags: [Expedientes]
      operationId: listarParticipantes
      summary: Listar la ACL del expediente
      x-permiso: expedientes.leer
      responses:
        "200":
          description: Participantes
          content:
            application/json:
              schema:
