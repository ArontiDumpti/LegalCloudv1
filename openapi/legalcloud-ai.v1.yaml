      x-permiso: asistente.conversar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MensajeCrear"
            example:
              contenido: ¿Cuáles son los requisitos establecidos para realizar el procedimiento de licencia de funcionamiento?
      responses:
        "200":
          description: Respuesta sustentada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intercambio"
              example:
                pregunta:
                  id: 9c1d1b22-0a11-4e55-8a10-11aa22bb33cc
                  rol: usuario
                  contenido: ¿Cuáles son los requisitos establecidos para realizar el procedimiento de licencia de funcionamiento?
                  creadoEn: "2026-10-14T22:10:00Z"
                respuesta:
                  id: 9c1d1b22-0a11-4e55-8a10-11aa22bb33cd
                  rol: asistente
                  contenido: El reglamento exige solicitud firmada, plano de ubicación y pago de la tasa. La resolución fija un plazo de 15 días hábiles.
                  respuestaSustentada: true
                  fuentes:
                    - documentoId: 11111111-1111-1111-1111-111111111111
                      versionId: 22222222-2222-2222-2222-222222222222
                      titulo: Reglamento de licencias
                      pagina: 4
                      fragmento: Son requisitos la solicitud firmada, el plano de ubicación y el comprobante de pago de la tasa.
                      puntaje: 0.86
                      hashSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  creadoEn: "2026-10-14T22:10:03Z"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "504":
          description: El modelo no respondió dentro del tiempo límite. La pregunta quedó registrada.
          content:
