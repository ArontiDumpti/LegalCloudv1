                  maxLength: 2000
      responses:
        "202":
          description: Nueva versión vigente en procesamiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmacionVersion"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"

