        - name: hasta
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaEventos"
        "403":
          $ref: "#/components/responses/Prohibido"

  /auditoria/{eventoId}:
    parameters:
      - $ref: "#/components/parameters/EventoId"
    get:
      tags: [Auditoria]
      operationId: obtenerEventoAuditoria
      summary: Obtener un evento de auditoría
      x-permiso: auditoria.leer
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoAuditoria"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: obtenerDashboard
      summary: Indicadores del alcance del usuario
      x-permiso: dashboard.leer
      responses:
        "200":
          description: Resumen operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT de acceso. Claims mínimos: `sub`, `org_id`, `roles`, `permissions`, `exp`.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Reenviar la misma clave y el mismo cuerpo devuelve el resultado original durante 24 horas.
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RolId:
      name: rolId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoriaId:
      name: categoriaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpedienteId:
      name: expedienteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentoId:
      name: documentoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrabajoId:
      name: trabajoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusquedaId:
      name: busquedaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversacionId:
      name: conversacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResumenId:
      name: resumenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificacionId:
      name: notificacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    SolicitudInvalida:
      description: Cuerpo o parámetros con formato inválido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutenticado:
      description: Token ausente, vencido o revocado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Prohibido:
      description: El rol o la ACL del expediente no permiten la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoEncontrado:
      description: Recurso inexistente o fuera de la organización
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    Conflicto:
      description: Estado incompatible, duplicado o transición no permitida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    EntidadImprocesable:
      description: Regla de negocio no satisfecha
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    DemasiadasSolicitudes:
      description: Cuota de autenticación o de consultas de IA agotada
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"

  schemas:
    Salud:
      type: object
      required: [estado, version]
      properties:
        estado:
          type: string
          enum: [ok]
        version:
          type: string
          example: 1.0.0

    Problema:
      type: object
      required: [type, title, status, detalle, codigo, trazaId]
      properties:
        type:
          type: string
          format: uri
          example: https://api.legalcloud.example/problemas/conflicto-estado
        title:
          type: string
        status:
          type: integer
        detalle:
          type: string
        codigo:
          type: string
          enum:
            - validacion
            - no_autenticado
            - prohibido
            - no_encontrado
            - conflicto_estado
            - duplicado
            - archivo_no_soportado
            - archivo_demasiado_grande
            - procesamiento_en_curso
            - cuota_ia_excedida
            - tiempo_agotado
            - error_interno
        instancia:
          type: string
          format: uri
        trazaId:
          type: string
          format: uuid
        errores:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo:
                type: string
              mensaje:
                type: string

    Paginacion:
      type: object
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
        nextCursor:
          type: string
          nullable: true

    InicioSesion:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    Renovacion:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AceptarInvitacion:
      type: object
      required: [token, contrasena]
      properties:
        token:
          type: string
        contrasena:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    CambioContrasena:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
          format: password
        contrasenaNueva:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    Token:
      type: object
      required: [tokenType, accessToken, refreshToken, expiraEn]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        refreshToken:
          type: string
        expiraEn:
          type: integer
          description: Segundos de vida del access token
          example: 900

    Perfil:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          required: [permisos]
          properties:
            permisos:
              type: array
              items:
                type: string

    EstadoUsuario:
      type: string
      enum: [invitado, activo, suspendido]

    Usuario:
      type: object
      required: [id, correo, nombre, estado, roles, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        correo:
          type: string
          format: email
        nombre:
          type: string
        apellido:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoUsuario"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RolResumen"
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    UsuarioInvitar:
      type: object
      required: [correo, nombre, roles]
      properties:
        correo:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        roles:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    UsuarioActualizar:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120

    PaginaUsuarios:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Usuario"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    Permiso:
      type: object
      required: [codigo, modulo, descripcion]
      properties:
        codigo:
          type: string
          example: asistente.conversar
        modulo:
          type: string
          example: asistente
        descripcion:
          type: string

    RolResumen:
      type: object
      required: [id, codigo, nombre]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: RESPONSABLE_DOCUMENTAL
        nombre:
          type: string

    Rol:
      allOf:
        - $ref: "#/components/schemas/RolResumen"
        - type: object
          required: [sistema, permisos]
          properties:
            descripcion:
              type: string
            sistema:
              type: boolean
              description: Verdadero en los cuatro roles iniciales del producto
            permisos:
              type: array
              items:
                type: string

    RolCrear:
      type: object
      required: [codigo, nombre, permisos]
      properties:
        codigo:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,40}$"
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500
        permisos:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string

    RolActualizar:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 500

    Categoria:
      type: object
      required: [id, codigo, nombre, activa, ruta]
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        padreId:
          type: string
          format: uuid
          nullable: true
        activa:
          type: boolean
        ruta:
          type: string
          example: Normativa / Municipal / Licencias

    CategoriaCrear:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          maxLength: 40
        nombre:
          type: string
          maxLength: 160
        descripcion:
          type: string
          maxLength: 500
        padreId:
          type: string
          format: uuid

    CategoriaActualizar:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 160
        descripcion:
          type: string
          maxLength: 500
        padreId:
          type: string
          format: uuid
          nullable: true

    NivelConfidencialidad:
      type: string
      enum: [interno, restringido, confidencial, reservado]

    EstadoExpediente:
      type: string
      enum: [borrador, en_tramite, en_revision, cerrado, archivado]

    Expediente:
      type: object
      required:
        - id
        - codigo
        - titulo
        - estado
        - nivelConfidencialidad
        - responsableId
        - creadoEn
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: EXP-2026-00041
          description: Asignado por el servidor
        titulo:
          type: string
        descripcion:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoExpediente"
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        categoriaId:
          type: string
          format: uuid
          nullable: true
        responsableId:
          type: string
          format: uuid
        etiquetas:
          type: array
          items:
            type: string
        documentos:
          type: integer
          description: Conteo de documentos no archivados
        creadoPor:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
        cerradoEn:
          type: string
          format: date-time
          nullable: true

    ExpedienteCrear:
      type: object
      required: [titulo, nivelConfidencialidad]
      properties:
        titulo:
          type: string
          maxLength: 240
        descripcion:
          type: string
          maxLength: 4000
        categoriaId:
          type: string
          format: uuid
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        etiquetas:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40

    ExpedienteActualizar:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 240
        descripcion:
          type: string
          maxLength: 4000
        categoriaId:
          type: string
          format: uuid
          nullable: true
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        etiquetas:
          type: array
          maxItems: 20
          items:
            type: string

    TransicionExpediente:
      type: object
      required: [accion]
      properties:
        accion:
          type: string
          enum: [abrir, enviar_a_revision, devolver, cerrar, archivar, reabrir]
        comentario:
          type: string
          maxLength: 2000

    PaginaExpedientes:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Expediente"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    RolEnExpediente:
      type: string
      enum: [responsable, editor, revisor, lector]
      description: |
        lector: leer, descargar, buscar y preguntar.
        revisor: lector + clasificar metadatos + resumir.
        editor: revisor + cargar documentos, versiones y reprocesar.
        responsable: editor + transiciones y ACL.

    Participante:
      type: object
      required: [usuarioId, nombre, rolEnExpediente]
      properties:
        usuarioId:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rolEnExpediente:
          $ref: "#/components/schemas/RolEnExpediente"

    ParticipanteAsignar:
      type: object
      required: [usuarioId, rolEnExpediente]
      properties:
        usuarioId:
          type: string
          format: uuid
        rolEnExpediente:
          $ref: "#/components/schemas/RolEnExpediente"

    TipoDocumento:
      type: string
      enum: [reglamento, resolucion, informe, acta, contrato, oficio, otro]

    EstadoProcesamiento:
      type: string
      enum: [pendiente_carga, en_ocr, en_indexacion, indexado, error, archivado]

    Documento:
      type: object
      required: [id, expedienteId, titulo, tipo, origen, estadoProcesamiento, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        expedienteId:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
        tipo:
          $ref: "#/components/schemas/TipoDocumento"
        origen:
          type: string
          enum: [digital, digitalizado]
        categoriaId:
          type: string
          format: uuid
          nullable: true
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        estadoProcesamiento:
          $ref: "#/components/schemas/EstadoProcesamiento"
        versionVigente:
          $ref: "#/components/schemas/VersionResumen"
        creadoPor:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    DocumentoIniciar:
      type: object
      required: [titulo, tipo, origen, nombreArchivo, tipoMime, tamanoBytes]
      properties:
        titulo:
          type: string
          maxLength: 240
        descripcion:
          type: string
          maxLength: 4000
        tipo:
          $ref: "#/components/schemas/TipoDocumento"
        origen:
          type: string
          enum: [digital, digitalizado]
          description: "`digitalizado` fuerza OCR aunque el archivo contenga una capa de texto."
        categoriaId:
          type: string
          format: uuid
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        nombreArchivo:
          type: string
          maxLength: 255
        tipoMime:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
            - image/jpeg
            - image/png
            - image/tiff
        tamanoBytes:
          type: integer
          minimum: 1
        notas:
          type: string
          maxLength: 2000

    DocumentoActualizar:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 240
        descripcion:
          type: string
          maxLength: 4000
        tipo:
          $ref: "#/components/schemas/TipoDocumento"
        categoriaId:
          type: string
          format: uuid
          nullable: true
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"

    PaginaDocumentos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Documento"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    VersionResumen:
      type: object
      required: [id, numero, esVigente]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
        esVigente:
          type: boolean
        hashSha256:
          type: string
          nullable: true

    VersionDocumento:
      type: object
      required: [id, documentoId, numero, estado, esVigente, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        documentoId:
          type: string
          format: uuid
        numero:
          type: integer
        nombreArchivo:
          type: string
        tipoMime:
          type: string
        tamanoBytes:
          type: integer
          nullable: true
        hashSha256:
          type: string
          nullable: true
        notas:
          type: string
        estado:
          type: string
          enum: [reservada, vigente, sustituida, fallida]
        esVigente:
          type: boolean
        estadoOcr:
          type: string
          enum: [no_requerido, en_cola, procesando, completado, fallido]
        estadoIndexacion:
          type: string
          enum: [en_cola, procesando, completado, fallido, retirada]
        restauradaDesdeVersionId:
          type: string
          format: uuid
          nullable: true
        subidoPor:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        confirmadoEn:
          type: string
          format: date-time
          nullable: true

    VersionIniciar:
      type: object
      required: [nombreArchivo, tipoMime, tamanoBytes]
      properties:
        nombreArchivo:
          type: string
          maxLength: 255
        tipoMime:
          type: string
        tamanoBytes:
          type: integer
          minimum: 1
        notas:
          type: string
          maxLength: 2000

    InstruccionesCarga:
      type: object
      required: [metodo, url, expiraEn]
      properties:
        metodo:
          type: string
          enum: [PUT]
        url:
          type: string
          format: uri
        encabezados:
          type: object
          additionalProperties:
            type: string
        expiraEn:
          type: string
          format: date-time

    CargaIniciada:
      type: object
      required: [documento, version, carga]
      properties:
        documento:
          $ref: "#/components/schemas/Documento"
        version:
          $ref: "#/components/schemas/VersionDocumento"
        carga:
          $ref: "#/components/schemas/InstruccionesCarga"

    ConfirmacionVersion:
      type: object
      required: [version, trabajo]
      properties:
        version:
          $ref: "#/components/schemas/VersionDocumento"
        trabajo:
          $ref: "#/components/schemas/Trabajo"

    Descarga:
      type: object
      required: [url, expiraEn, hashSha256]
      properties:
        url:
          type: string
          format: uri
        expiraEn:
          type: string
          format: date-time
        nombreArchivo:
          type: string
        hashSha256:
          type: string

    PaginaTexto:
      type: object
      required: [versionId, datos, paginacion]
      properties:
        versionId:
          type: string
          format: uuid
        datos:
          type: array
          items:
            type: object
            required: [pagina, texto]
            properties:
              pagina:
                type: integer
              texto:
                type: string
              confianzaOcr:
                type: number
                format: float
                minimum: 0
                maximum: 1
                nullable: true
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    ProcesamientoSolicitar:
      type: object
      required: [etapas]
      properties:
        etapas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ocr, embeddings]
        idioma:
          type: string
          description: Pista BCP 47 para el OCR
          example: es

    EstadoTrabajo:
      type: string
      enum: [en_cola, procesando, completado, fallido]

    Trabajo:
      type: object
      required: [id, versionId, etapas, estado, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        documentoId:
          type: string
          format: uuid
        etapas:
          type: array
          items:
            type: string
            enum: [ocr, embeddings]
        estado:
          $ref: "#/components/schemas/EstadoTrabajo"
        paginas:
          type: integer
          nullable: true
        fragmentos:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
        iniciadoEn:
          type: string
          format: date-time
          nullable: true
        finalizadoEn:
          type: string
          format: date-time
          nullable: true

    ModoBusqueda:
      type: string
      enum: [lexica, semantica, hibrida]
      default: hibrida

    BusquedaCrear:
      type: object
      required: [consulta]
      properties:
        consulta:
          type: string
          minLength: 2
          maxLength: 1000
        modo:
          $ref: "#/components/schemas/ModoBusqueda"
        limite:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        filtros:
          $ref: "#/components/schemas/FiltrosDocumentales"

    FiltrosDocumentales:
      type: object
      properties:
        expedienteId:
          type: string
          format: uuid
        documentoIds:
          type: array
          items:
            type: string
            format: uuid
        categoriaId:
          type: string
          format: uuid
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoDocumento"
        nivelConfidencialidad:
          $ref: "#/components/schemas/NivelConfidencialidad"
        soloVersionVigente:
          type: boolean
          default: true

    Fuente:
      type: object
      required: [documentoId, versionId, titulo, fragmento, hashSha256]
      properties:
        documentoId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        expedienteId:
          type: string
          format: uuid
        titulo:
          type: string
        pagina:
          type: integer
          nullable: true
        fragmento:
          type: string
          description: Cita textual usada como evidencia. No es una paráfrasis del modelo.
        puntaje:
          type: number
          format: float
          minimum: 0
          maximum: 1
        hashSha256:
          type: string
          description: Hash de la versión citada, para comprobar que la fuente no cambió.

    Busqueda:
      type: object
      required: [id, consulta, modo, resultados, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        consulta:
          type: string
        modo:
          $ref: "#/components/schemas/ModoBusqueda"
        filtros:
          $ref: "#/components/schemas/FiltrosDocumentales"
        resultados:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        creadoPor:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time

    PaginaBusquedas:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Busqueda"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    AlcanceAsistente:
      type: object
      properties:
        expedienteIds:
          type: array
          items:
            type: string
            format: uuid
        documentoIds:
          type: array
          items:
            type: string
            format: uuid
        categoriaIds:
          type: array
          items:
            type: string
            format: uuid

    ConversacionCrear:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 200
        alcance:
          $ref: "#/components/schemas/AlcanceAsistente"

    Conversacion:
      type: object
      required: [id, alcance, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
          nullable: true
        alcance:
          $ref: "#/components/schemas/AlcanceAsistente"
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    RolMensaje:
      type: string
      enum: [usuario, asistente]

    Mensaje:
      type: object
      required: [id, rol, contenido, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        rol:
          $ref: "#/components/schemas/RolMensaje"
        contenido:
          type: string
        respuestaSustentada:
          type: boolean
          nullable: true
        fuentes:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        creadoEn:
          type: string
          format: date-time

    MensajeCrear:
      type: object
      required: [contenido]
      properties:
        contenido:
          type: string
          minLength: 2
          maxLength: 4000

    Intercambio:
      type: object
      required: [pregunta, respuesta]
      properties:
        pregunta:
          $ref: "#/components/schemas/Mensaje"
        respuesta:
          $ref: "#/components/schemas/Mensaje"

    ConversacionDetalle:
      allOf:
        - $ref: "#/components/schemas/Conversacion"
        - type: object
          required: [mensajes]
          properties:
            mensajes:
              type: array
              items:
                $ref: "#/components/schemas/Mensaje"

    PaginaConversaciones:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Conversacion"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    ResumenSolicitar:
      type: object
      required: [alcance, recursoId]
      properties:
        alcance:
          type: string
          enum: [expediente, documento, version]
        recursoId:
          type: string
          format: uuid
        extension:
          type: string
          enum: [breve, ejecutivo, detallado]
          default: ejecutivo

    Resumen:
      type: object
      required: [id, alcance, recursoId, estado, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        alcance:
          type: string
          enum: [expediente, documento, version]
        recursoId:
          type: string
          format: uuid
        extension:
          type: string
          enum: [breve, ejecutivo, detallado]
        estado:
          $ref: "#/components/schemas/EstadoTrabajo"
        contenido:
          type: string
          nullable: true
        fuentes:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        error:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
        finalizadoEn:
          type: string
          format: date-time
          nullable: true

    TipoNotificacion:
      type: string
      enum:
        - expediente_asignado
        - expediente_transicionado
        - documento_indexado
        - procesamiento_fallido
        - resumen_listo

    Notificacion:
      type: object
      required: [id, tipo, titulo, mensaje, leida, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: "#/components/schemas/TipoNotificacion"
        titulo:
          type: string
        mensaje:
          type: string
        leida:
          type: boolean
        recursoTipo:
          $ref: "#/components/schemas/TipoRecurso"
        recursoId:
          type: string
          format: uuid
        creadoEn:
          type: string
          format: date-time
        leidaEn:
          type: string
          format: date-time
          nullable: true

    PaginaNotificaciones:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Notificacion"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    TipoRecurso:
      type: string
      enum:
        - usuario
        - rol
        - categoria
        - expediente
        - documento
        - version
        - trabajo
        - busqueda
        - conversacion
        - resumen

    ResultadoAuditoria:
      type: string
      enum: [exito, denegado, error]

    EventoAuditoria:
      type: object
      required: [id, actorId, accion, recursoTipo, resultado, ocurridoEn]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorCorreo:
          type: string
          format: email
        accion:
          type: string
          description: |
            Catálogo estable, por ejemplo `expediente.crear`, `expediente.transicionar`,
            `documento.iniciar`, `version.confirmar`, `documento.descargar`,
            `procesamiento.ejecutar`, `busqueda.crear`, `asistente.consultar`,
            `resumen.solicitar`, `usuario.roles_reemplazados`.
          example: asistente.consultar
        recursoTipo:
          $ref: "#/components/schemas/TipoRecurso"
        recursoId:
          type: string
          format: uuid
          nullable: true
        resultado:
          $ref: "#/components/schemas/ResultadoAuditoria"
        direccionIp:
          type: string
          nullable: true
        requestId:
          type: string
        metadatos:
          type: object
          additionalProperties: true
          description: Diferencias de metadatos, transición o identificadores de fuentes. Sin binarios ni secretos.
        ocurridoEn:
          type: string
          format: date-time

    PaginaEventos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/EventoAuditoria"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    Dashboard:
      type: object
      required: [expedientesPorEstado, documentosPorProcesamiento, generadoEn]
      properties:
        expedientesPorEstado:
          type: object
          additionalProperties:
            type: integer
          example:
            borrador: 2
            en_tramite: 14
            en_revision: 3
            cerrado: 9
            archivado: 21
        documentosPorProcesamiento:
          type: object
          additionalProperties:
            type: integer
          example:
            en_ocr: 1
            en_indexacion: 2
            indexado: 86
            error: 1
        consultas7d:
          type: integer
        resumenes7d:
          type: integer
        almacenamientoBytes:
          type: integer
          format: int64
        actividadReciente:
          type: array
          items:
            $ref: "#/components/schemas/EventoAuditoria"
        generadoEn:
          type: string
          format: date-time
