    get:
      tags: [Documentos]
      operationId: listarDocumentos
      summary: Listar documentos del expediente
      x-permiso: documentos.leer
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: categoriaId
          in: query
          schema:
            type: string
            format: uuid
        - name: tipo
          in: query
          schema:
            $ref: "#/components/schemas/TipoDocumento"
        - name: estadoProcesamiento
          in: query
          schema:
            $ref: "#/components/schemas/EstadoProcesamiento"
