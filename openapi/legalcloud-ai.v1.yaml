          $ref: "#/components/responses/NoEncontrado"

  /documentos/{documentoId}/versiones/{versionId}/confirmar:
    parameters:
      - $ref: "#/components/parameters/DocumentoId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Versiones]
      operationId: confirmarVersion
      summary: Confirmar el binario subido y encolar OCR e indexación
      description: |
        Verifica tamaño y hash contra el objeto almacenado. Si coinciden,
        publica la versión como vigente y crea un trabajo de procesamiento.
        La versión anterior permanece consultable, pero deja de ser la vigente.
      x-permiso: versiones.crear
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashSha256]
              properties:
                hashSha256:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
      responses:
        "202":
          description: Versión publicada y procesamiento encolado
          headers:
            Location:
              schema:
                type: string
              description: URL del trabajo de procesamiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmacionVersion"
        "409":
          description: Hash distinto al objeto almacenado, o la reserva expiró
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "422":
          $ref: "#/components/responses/EntidadImprocesable"

  /documentos/{documentoId}/versiones/{versionId}/restaurar:
