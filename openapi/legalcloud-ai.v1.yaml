    post:
      tags: [Asistente]
      operationId: crearMensaje
      summary: Preguntar al asistente RAG
      description: |
        Recupera fragmentos de versiones indexadas dentro del alcance y de la ACL,
        genera la respuesta solo con ese contexto y devuelve las fuentes.
        Si no hay evidencia suficiente, `respuestaSustentada` es false y el
        contenido lo declara, sin inventar requisitos.
