      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Versiones]
      operationId: restaurarVersion
      summary: Publicar una versión nueva copiada desde una anterior
      description: No reescribe historia. La nueva versión cita `restauradaDesdeVersionId` y se reindexa.
      x-permiso: versiones.restaurar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notas:
